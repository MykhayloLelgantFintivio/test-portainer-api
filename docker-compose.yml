services:
  test-app:
    image: httpd:alpine                    # ← Apache HTTP Server
    container_name: test-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/local/apache2/htdocs:ro   # ← Directorio de Apache
    environment:
      - DEPLOY_TIMESTAMP=${DEPLOY_TIMESTAMP}
      - GITHUB_SHA=${GITHUB_SHA}
      - GITHUB_ACTOR=${GITHUB_ACTOR}
      - DEPLOY_STATUS=${DEPLOY_STATUS}
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test-app.rule=Host(`test-app.staging.dicoded.vegarislabs.com`)"
      - "traefik.http.routers.test-app.entrypoints=web,websecure"
      - "traefik.http.routers.test-app.tls=true"
      - "traefik.http.routers.test-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.test-app.loadbalancer.server.port=80"